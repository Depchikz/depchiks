name: Unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o UpgraderApp_2_91.zip -d tmp
          d=tmp
          if [ "$(ls -A tmp | wc -l)" -eq 1 ] && [ -d "tmp/$(ls -A tmp)" ]; then d="tmp/$(ls -A tmp)"; fi
          cp -r "$d"/. .
          rm -rf tmp
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m "Unzip site"
          git push
